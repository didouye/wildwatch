[project]
name = "wildwatch-server"
version = "0.1.0"
description = "WildWatch web server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pillow>=10.0",
]

[project.scripts]
wildwatch-server = "wildwatch_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildwatch_server"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
