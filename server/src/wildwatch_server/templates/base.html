<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WildWatch{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body class="min-h-full text-slate-100">
  <header class="border-b border-slate-700 bg-slate-800">
    <div class="mx-auto max-w-7xl px-4 py-4 flex items-center justify-between">
      <a href="/gallery" class="flex items-center gap-2 text-xl font-semibold tracking-tight">
        <span>WildWatch</span>
      </a>
      <nav class="text-sm text-slate-300 flex gap-4">
        <a href="/gallery" class="hover:text-white">Gallery</a>
        <a href="/cameras" class="hover:text-white">Cameras</a>
        <a href="/stats" class="hover:text-white">Stats</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
