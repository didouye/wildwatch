<button
  hx-post="/photos/{{ photo.id }}/favorite"
  hx-swap="outerHTML"
  class="text-2xl {{ 'text-amber-400' if photo.is_favorite else 'text-slate-500 hover:text-amber-400' }}"
  title="{{ 'Remove from favorites' if photo.is_favorite else 'Mark as favorite' }}"
>{{ '★' if photo.is_favorite else '☆' }}</button>
