[project]
name = "wildwatch-capture"
version = "0.1.0"
description = "WildWatch capture client running on Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
wildwatch-capture = "wildwatch_capture.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildwatch_capture"]

[dependency-groups]
dev = [
    # numpy is imported by motion.py, but on the RPi it is provided by the
    # apt package python3-picamera2 → we get it via --system-site-packages.
    # On a dev box (Mac/Linux for tests), uv installs it explicitly.
    "numpy>=1.24",
    # Pillow is used by state_publisher.py (preview JPEG encode). On the RPi
    # it ships via python3-picamera2 (--system-site-packages); dev box needs
    # it explicitly for tests.
    "pillow>=10",
    "pytest>=8",
    "ruff>=0.6",
]
