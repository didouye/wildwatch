[project]
name = "birdy-capture"
version = "0.1.0"
description = "Wildlife photobooth capture client running on Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
birdy-capture = "birdy_capture.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdy_capture"]

[dependency-groups]
dev = [
    # numpy est requis par le code (motion.py) mais sur le RPi il est fourni
    # par le paquet apt python3-picamera2 → on l'utilise via --system-site-packages.
    # Sur le Mac (tests/dev), on a besoin de l'installer via uv.
    "numpy>=1.24",
    "pytest>=8",
    "ruff>=0.6",
]
